<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2780" viewBox="0 0 960 2780" font-family="Arial, Helvetica, sans-serif">
<title>CITE workshop slide templates: divider, concept, demo, lab, checkpoint (proposal mockups)</title>
<desc>Five 960x540 point slide templates drawn from tokens.json. Content quoted from Guardrails.md and Examples.md; the lab command is a placeholder pending linux/ verification. Not a final deck.</desc>
<rect width="960" height="2780" fill="#D9DEDD"/>

<!-- ============ 1. SECTION DIVIDER (black, existing Kevin choice) ============ -->
<g transform="translate(0,0)">
  <rect width="960" height="540" fill="#000000"/>
  <text x="48" y="42" font-size="14" font-weight="bold" fill="#E7B678" letter-spacing="0.6">02 · GUARDRAILS</text>
  <text x="912" y="42" font-size="14" fill="#FFFFFF" text-anchor="end">0:08 → 0:16</text>
  <text x="48" y="190" font-size="96" font-weight="bold" fill="#E7B678">02</text>
  <rect x="48" y="214" width="120" height="6" fill="#E7B678"/>
  <text x="48" y="290" font-size="48" font-weight="bold" fill="#FFFFFF">Guardrails</text>
  <text x="48" y="340" font-size="24" fill="#FFFFFF">Five rules first. They make everything after this safe.</text>
  <!-- ForDarkBG logo is used directly; no white patch -->
  <g transform="translate(690,474)">
    <circle cx="17" cy="17" r="17" fill="#155191" stroke="#E7B678" stroke-width="3"/>
    <text x="44" y="13" font-size="10" fill="#FFFFFF">Orange County</text>
    <text x="44" y="26" font-size="12" font-weight="bold" fill="#FFFFFF">Department of Education</text>
    <text x="0" y="52" font-size="9" fill="#9AA3AD">[placeholder for Mark-Title-COLOR-ForDarkBG.png]</text>
  </g>
</g>

<!-- ============ 2. CONCEPT ============ -->
<g transform="translate(0,560)">
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="48" y="42" font-size="14" font-weight="bold" fill="#155191" letter-spacing="0.6">02 · GUARDRAILS</text>
  <text x="912" y="42" font-size="14" fill="#454B53" text-anchor="end">0:09</text>
  <text x="48" y="112" font-size="36" font-weight="bold" fill="#111111">Read before you run</text>
  <rect x="48" y="132" width="64" height="5" fill="#155191"/>
  <g font-size="24" fill="#111111">
    <text x="48" y="222" font-weight="bold" fill="#155191">1</text><text x="88" y="222">It writes confident commands, right or wrong.</text>
    <text x="48" y="292" font-weight="bold" fill="#155191">2</text><text x="88" y="292">Anything that deletes, disables, or sends gets read first.</text>
    <text x="48" y="362" font-weight="bold" fill="#155191">3</text><text x="88" y="362">You are the last check.</text>
  </g>
  <rect x="48" y="500" width="864" height="1" fill="#CCD2DA"/>
  <text x="48" y="524" font-size="14" fill="#454B53">CITE 2026 · AI for Cyber Security</text>
  <text x="912" y="524" font-size="14" fill="#454B53" text-anchor="end">09</text>
</g>

<!-- ============ 3. DEMO (instructor drives; navy stage) ============ -->
<g transform="translate(0,1120)">
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect x="48" y="24" width="84" height="26" fill="#155191"/>
  <text x="90" y="42" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">▶ DEMO</text>
  <text x="146" y="42" font-size="14" fill="#454B53">Instructor drives · you watch · 6 min</text>
  <text x="912" y="42" font-size="14" fill="#454B53" text-anchor="end">0:52</text>
  <text x="48" y="104" font-size="36" font-weight="bold" fill="#111111">Code review: read it before it runs</text>
  <rect x="48" y="128" width="864" height="232" fill="#0B1E33"/>
  <text x="68" y="160" font-size="16" font-weight="bold" fill="#E7B678">PROMPT</text>
  <g font-size="24" fill="#FFFFFF">
    <text x="68" y="198">Read deploy.ps1. I am about to run this as a domain</text>
    <text x="68" y="230">admin. Walk me through what it actually does. Flag</text>
    <text x="68" y="262">anything that reaches out, changes permissions, or</text>
    <text x="68" y="294">hides its activity. …</text>
  </g>
  <text x="68" y="338" font-size="16" fill="#E7B678">Full prompt: Workbook 3.4 · Examples.md</text>
  <text x="48" y="400" font-size="16" font-weight="bold" fill="#155191">WATCH FOR</text>
  <g font-size="24" fill="#111111">
    <text x="48" y="436">◆ The internet-reachout flag, if the script has one.</text>
    <text x="48" y="472">◆ Nothing runs. It reads first.</text>
  </g>
  <rect x="48" y="500" width="864" height="1" fill="#CCD2DA"/>
  <text x="48" y="524" font-size="14" fill="#454B53">CITE 2026 · AI for Cyber Security</text>
  <text x="912" y="524" font-size="14" fill="#454B53" text-anchor="end">31</text>
</g>

<!-- ============ 4. LAB (attendees drive) ============ -->
<g transform="translate(0,1680)">
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect x="0" y="0" width="960" height="64" fill="#0B1E33"/>
  <text x="48" y="42" font-size="22" font-weight="bold" fill="#E7B678">LAB 1 · YOUR HANDS · 10 MIN</text>
  <text x="912" y="42" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="end">Stop at 0:34</text>
  <text x="48" y="112" font-size="36" font-weight="bold" fill="#111111">Confirm the tool answers</text>
  <g font-size="24" fill="#111111">
    <text x="48" y="164" font-weight="bold" fill="#155191">1</text><text x="80" y="164">Open your terminal (WSL, Linux, or macOS).</text>
    <text x="48" y="204" font-weight="bold" fill="#155191">2</text><text x="80" y="204">Make an empty scratch folder and cd into it.</text>
    <text x="48" y="244" font-weight="bold" fill="#155191">3</text><text x="80" y="244">Run the version check below.</text>
    <text x="48" y="284" font-weight="bold" fill="#155191">4</text><text x="80" y="284">Start a session and ask it to list the folder.</text>
  </g>
  <rect x="48" y="304" width="864" height="78" fill="#0B1E33"/>
  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="20" fill="#FFFFFF">
    <text x="68" y="335"><tspan fill="#E7B678">$ </tspan>mkdir -p ~/cite-lab &amp;&amp; cd ~/cite-lab</text>
    <text x="68" y="364"><tspan fill="#E7B678">$ </tspan>claude --version</text>
  </g>
  <rect x="48" y="398" width="420" height="92" fill="#EFF4FA"/>
  <rect x="48" y="398" width="6" height="92" fill="#1E6B3A"/>
  <text x="68" y="424" font-size="16" font-weight="bold" fill="#1E6B3A">✓ DONE WHEN</text>
  <text x="68" y="452" font-size="20" fill="#111111">A version number shows, and it names</text>
  <text x="68" y="478" font-size="20" fill="#111111">the empty folder.</text>
  <rect x="492" y="398" width="420" height="92" fill="#EFF4FA"/>
  <rect x="492" y="398" width="6" height="92" fill="#7A4A00"/>
  <text x="512" y="424" font-size="16" font-weight="bold" fill="#7A4A00">↪ STUCK?</text>
  <text x="512" y="452" font-size="20" fill="#111111">Workbook 1.4, or pair up and</text>
  <text x="512" y="478" font-size="20" fill="#111111">follow the instructor screen.</text>
  <text x="48" y="524" font-size="14" fill="#454B53">Placeholder command: final text comes from linux/ after verification · Workbook 1.2</text>
  <text x="912" y="524" font-size="14" fill="#454B53" text-anchor="end">17</text>
</g>

<!-- ============ 5. CHECKPOINT ============ -->
<g transform="translate(0,2240)">
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect x="48" y="24" width="150" height="26" fill="#111111"/>
  <text x="123" y="42" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">■ CHECKPOINT</text>
  <text x="912" y="42" font-size="14" fill="#454B53" text-anchor="end">0:34 · 2 min</text>
  <text x="48" y="112" font-size="36" font-weight="bold" fill="#111111">Where is your lab 1?</text>
  <text x="48" y="150" font-size="20" fill="#454B53">Hold up the card that matches, or type it in chat.</text>
  <g>
    <rect x="48" y="178" width="864" height="88" fill="#FFFFFF" stroke="#1E6B3A" stroke-width="3"/>
    <text x="72" y="234" font-size="40" font-weight="bold" fill="#1E6B3A">✓</text>
    <text x="124" y="218" font-size="16" font-weight="bold" fill="#1E6B3A">WORKING</text>
    <text x="124" y="248" font-size="24" fill="#111111">Version shows and it answered. Try the extension.</text>
  </g>
  <g>
    <rect x="48" y="282" width="864" height="88" fill="#FFFFFF" stroke="#7A4A00" stroke-width="3" stroke-dasharray="10 5"/>
    <text x="72" y="338" font-size="40" font-weight="bold" fill="#7A4A00">~</text>
    <text x="124" y="322" font-size="16" font-weight="bold" fill="#7A4A00">PARTIAL</text>
    <text x="124" y="352" font-size="24" fill="#111111">Installed, login failed. Workbook 1.4. Helper is coming.</text>
  </g>
  <g>
    <rect x="48" y="386" width="864" height="88" fill="#FFFFFF" stroke="#B3261E" stroke-width="3" stroke-dasharray="3 4"/>
    <text x="72" y="442" font-size="40" font-weight="bold" fill="#B3261E">✕</text>
    <text x="124" y="426" font-size="16" font-weight="bold" fill="#B3261E">BLOCKED</text>
    <text x="124" y="456" font-size="24" fill="#111111">No install. Pair up and use fallback B.</text>
  </g>
  <rect x="48" y="500" width="864" height="1" fill="#CCD2DA"/>
  <text x="48" y="524" font-size="14" fill="#454B53">CITE 2026 · AI for Cyber Security</text>
  <text x="912" y="524" font-size="14" fill="#454B53" text-anchor="end">18</text>
</g>
